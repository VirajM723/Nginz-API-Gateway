services:
  postgres:
    image: postgres:16-alpine
    container_name: nginz-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nginz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d nginz" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nginz-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nginz-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: nginz-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.2.3
    container_name: nginz-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: nginz-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      JWT_SECRET: nginz_super_secret_jwt_key_2026_production_grade
      POSTGRES_URI: ${POSTGRES_URI:-postgresql://postgres:postgrespassword@postgres:5432/nginz}
      REDIS_URI: ${REDIS_URI:-redis://redis:6379}
      RABBITMQ_URI: ${RABBITMQ_URI:-amqp://guest:guest@rabbitmq:5672}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Auth Service Instances
  auth-service-1:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: always
    environment:
      SERVICE_PORT: 3001
      INSTANCE_ID: auth-service-1
      SERVICE_HOST: auth-service-1
      JWT_SECRET: nginz_super_secret_jwt_key_2026_production_grade
      POSTGRES_URI: ${POSTGRES_URI:-postgresql://postgres:postgrespassword@postgres:5432/nginz}
      REDIS_URI: ${REDIS_URI:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service-2:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: always
    environment:
      SERVICE_PORT: 3001
      INSTANCE_ID: auth-service-2
      SERVICE_HOST: auth-service-2
      JWT_SECRET: nginz_super_secret_jwt_key_2026_production_grade
      POSTGRES_URI: ${POSTGRES_URI:-postgresql://postgres:postgrespassword@postgres:5432/nginz}
      REDIS_URI: ${REDIS_URI:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # User Service Instances
  user-service-1:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    restart: always
    environment:
      SERVICE_PORT: 3002
      INSTANCE_ID: user-service-1
      SERVICE_HOST: user-service-1
      POSTGRES_URI: ${POSTGRES_URI:-postgresql://postgres:postgrespassword@postgres:5432/nginz}
      REDIS_URI: ${REDIS_URI:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service-2:
