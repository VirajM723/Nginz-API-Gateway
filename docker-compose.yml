      REDIS_URI: ${REDIS_URI:-redis://redis:6379}
      RABBITMQ_URI: ${RABBITMQ_URI:-amqp://guest:guest@rabbitmq:5672}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginz-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
