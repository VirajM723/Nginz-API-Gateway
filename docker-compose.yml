    restart: always
    environment:
      SERVICE_PORT: 3002
      INSTANCE_ID: user-service-2
      SERVICE_HOST: user-service-2
      POSTGRES_URI: ${POSTGRES_URI:-postgresql://postgres:postgrespassword@postgres:5432/nginz}
      REDIS_URI: ${REDIS_URI:-redis://redis:6379}
