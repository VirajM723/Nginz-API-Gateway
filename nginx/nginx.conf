worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Logging format with request ID
    log_format nginz_log '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_request_id"';

    access_log /var/log/nginx/access.log nginz_log;
    error_log /var/log/nginx/error.log warn;

    # Resolve the gateway through Docker's DNS at request time so a recreated gateway container
    # (new IP) is picked up without restarting nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        set $gateway_upstream http://gateway:3000;

        # API Proxying
        location /api/ {
            proxy_pass $gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
        }

        # Health check proxy
        location /health {
            proxy_pass $gateway_upstream/health;
        }

        # Metrics proxy
        location /metrics {
            proxy_pass $gateway_upstream/metrics;
        }

        # Static Frontend Fallback
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
